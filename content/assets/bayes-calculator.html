<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bayes Calculator</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:30px;
    background:#1e1e1e;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
}

.slider-row{
    margin:25px 0;
}

label{
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

.value{
    color:#5ac8fa;
    font-weight:bold;
}

.result{
    margin-top:35px;
    padding:20px;
    border-radius:12px;
    background:#2a2a2a;
}

.bar{
    height:28px;
    border-radius:6px;
    margin-top:8px;
    margin-bottom:18px;
    background:#444;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#4CAF50;
    width:0%;
    transition:0.3s;
}

.formula{
    margin-top:25px;
    font-size:20px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>Bayes Theorem Calculator</h1>

<p>
Move the sliders to see how the posterior probability changes.
</p>

<div class="slider-row">

<label>

Prior P(C)

<span id="priorValue" class="value">0.01</span>

</label>

<input
id="prior"
type="range"
min="0.001"
max="0.5"
step="0.001"
value="0.01">

</div>

<div class="slider-row">

<label>

Sensitivity P(+|C)

<span id="sensValue" class="value">0.90</span>

</label>

<input
id="sens"
type="range"
min="0.5"
max="1"
step="0.01"
value="0.9">

</div>

<div class="slider-row">

<label>

False Positive P(+|¬C)

<span id="fpValue" class="value">0.20</span>

</label>

<input
id="fp"
type="range"
min="0"
max="0.5"
step="0.01"
value="0.2">

</div>

<div class="formula">

P(C|+) =
<span id="posteriorText"></span>

</div>

<div class="result">

<h3>Cancer Probability</h3>

<div class="bar">

<div class="fill" id="posteriorBar"></div>

</div>

<p id="posteriorPercent"></p>

</div>

</div>

<script>

const prior=document.getElementById("prior");
const sens=document.getElementById("sens");
const fp=document.getElementById("fp");

function update(){

const p=parseFloat(prior.value);
const s=parseFloat(sens.value);
const f=parseFloat(fp.value);

document.getElementById("priorValue").innerHTML=p.toFixed(3);
document.getElementById("sensValue").innerHTML=s.toFixed(2);
document.getElementById("fpValue").innerHTML=f.toFixed(2);

const numerator=s*p;

const denominator=
(s*p)+(f*(1-p));

const posterior=numerator/denominator;

document.getElementById("posteriorText").innerHTML=
posterior.toFixed(4);

document.getElementById("posteriorPercent").innerHTML=
(posterior*100).toFixed(2)+"%";

document.getElementById("posteriorBar").style.width=
(posterior*100)+"%";

}

prior.oninput=update;
sens.oninput=update;
fp.oninput=update;

update();

</script>

</body>
</html>
